services:
  app:
      build:
        context: .
        dockerfile: Dockerfile.dev
      image: sif-dev-admin:latest
      ports:
        - "3000:3000"
      volumes:
        - .:/app
        - /app/node_modules
      env_file:
        - .env.local
      environment:
      - NODE_ENV=development
      restart: unless-stopped
      command: npm run dev
