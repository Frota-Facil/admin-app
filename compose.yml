services:
  admin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CORE_API_URL=http://host.docker.internal:3333
      - MINIO_UPLOAD_HOST=host.docker.internal
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
